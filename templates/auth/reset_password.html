{% extends "base.html" %}
{% block title %}새 비밀번호 설정 — 매실 허브{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <h3 class="card-title text-center mb-1">새 비밀번호 설정</h3>
        <p class="text-center text-muted mb-4" style="font-size:14px">새로 사용할 비밀번호를 입력해 주세요. (최소 10자)</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">새 비밀번호</label>
            <input type="password" name="new_password" class="form-control" required
                   minlength="10" autofocus placeholder="최소 10자">
          </div>
          <div class="mb-3">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" name="confirm_password" class="form-control" required
                   minlength="10" placeholder="동일하게 입력">
          </div>
          <button type="submit" class="btn btn-success w-100">비밀번호 변경</button>
        </form>

        <div class="text-center mt-3">
          <small><a href="{{ url_for('auth.login') }}" class="text-muted">← 로그인으로 돌아가기</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
