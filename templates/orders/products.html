{% extends "base.html" %}
{% block title %}상품관리{% endblock %}
{% block content %}
<h4 class="mb-3">상품관리</h4>

<ul class="nav nav-tabs mb-3" id="productTabs">
  <li class="nav-item">
    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-products" type="button">상품 목록</button>
  </li>
  <li class="nav-item">
    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-rocket" type="button"
            onclick="loadRocketProducts()">🚀 로켓상품관리</button>
  </li>
</ul>

<div class="tab-content">
<div class="tab-pane fade show active" id="tab-products" role="tabpanel">

<!-- 검색/필터 -->
<div class="card mb-3">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label">상품명 검색</label>
        <input type="text" id="keyword" class="form-control form-control-sm" placeholder="검색어 입력" onkeydown="if(event.key==='Enter') loadProducts()">
      </div>
      <div class="col-md-2">
        <label class="form-label">종류</label>
        <select id="materialType" class="form-select form-select-sm">
          <option value="">전체</option>
          <option>원료</option><option>부재료</option><option>반제품</option><option>완제품</option><option>포장재</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">보관방법</label>
        <select id="storageMethod" class="form-select form-select-sm">
          <option value="">전체</option>
          <option>냉동</option><option>냉장</option><option>실온</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary btn-sm" onclick="loadProducts()">🔍 조회</button>
        <button class="btn btn-success btn-sm" onclick="showAddModal()">➕ 신규상품</button>
      </div>
    </div>
  </div>
</div>

<!-- 테이블 -->
<div class="table-responsive">
  <table class="table table-sm table-hover">
    <thead class="table-light">
      <tr>
        <th>SKU</th><th>상품명</th><th>유형</th><th>종류</th><th>보관</th>
        <th>단위</th><th>중량</th><th>바코드</th><th>메모</th><th>관리</th>
      </tr>
    </thead>
    <tbody id="productBody"></tbody>
  </table>
</div>
<div id="pagination" class="d-flex justify-content-center"></div>

</div><!-- /tab-products -->

<!-- ═══════ 로켓상품관리 탭 ═══════ -->
<div class="tab-pane fade" id="tab-rocket" role="tabpanel">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div class="text-muted small">
      로켓매출 수동입력 드롭다운에 뜨는 상품 목록입니다 (<code>master_prices.로켓판매가</code> 기준).
      <span class="text-danger">유령</span> = 상품DB에 없는 잘못된 이름 → 정정 필요.
    </div>
    <button class="btn btn-success btn-sm" onclick="showRocketModal()">➕ 로켓상품 추가</button>
  </div>
  <div class="table-responsive">
    <table class="table table-sm table-hover">
      <thead class="table-light">
        <tr><th>품목명</th><th class="text-end">로켓판매가</th><th class="text-center">상품DB</th><th class="text-center">관리</th></tr>
      </thead>
      <tbody id="rocketBody"></tbody>
    </table>
  </div>
</div>

</div><!-- /tab-content -->

<!-- 로켓상품 추가/수정 모달 -->
<div class="modal fade" id="rocketModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="rocketModalTitle">로켓상품</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="rkOrigName" value="">
    <div class="mb-2">
      <label class="form-label">상품명 <span class="text-danger">*</span></label>
      <input type="text" id="rkProductName" class="form-control form-control-sm" list="rkProductList" placeholder="상품DB의 정확한 이름 (예: 사과2p)">
      <datalist id="rkProductList"></datalist>
      <div class="form-text">상품DB에 있는 정확한 이름이어야 재고차감이 됩니다. (수정 시 유령이름 정정 가능)</div>
    </div>
    <div class="mb-2">
      <label class="form-label">로켓판매가 <span class="text-danger">*</span></label>
      <input type="number" id="rkPrice" class="form-control form-control-sm" min="1" value="0">
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-primary btn-sm" onclick="saveRocketProduct()">저장</button></div>
</div></div></div>

<!-- 신규/수정 모달 -->
<div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="modalTitle">상품</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="editMode" value="add">
    <input type="hidden" id="editName" value="">
    <div class="row mb-2">
      <div class="col-8"><label class="form-label">상품명 <span class="text-danger">*</span></label><input type="text" id="fProductName" class="form-control form-control-sm"></div>
      <div class="col-4"><label class="form-label">SKU</label><input type="text" id="fSku" class="form-control form-control-sm"></div>
    </div>
    <div class="row mb-2">
      <div class="col-4"><label class="form-label">유형</label><select id="fCostType" class="form-select form-select-sm"><option>매입</option><option>생산</option><option>소분</option><option>OEM</option></select></div>
      <div class="col-4"><label class="form-label">종류</label><select id="fMaterialType" class="form-select form-select-sm"><option>완제품</option><option>원료</option><option>부재료</option><option>반제품</option><option>포장재</option></select></div>
      <div class="col-4"><label class="form-label">보관</label><select id="fStorage" class="form-select form-select-sm"><option value="">-</option><option>냉동</option><option>냉장</option><option>실온</option></select></div>
    </div>
    <div class="row mb-2">
      <div class="col-4"><label class="form-label">원가</label><input type="number" id="fCostPrice" class="form-control form-control-sm" value="0"></div>
      <div class="col-4"><label class="form-label">단위</label><select id="fUnit" class="form-select form-select-sm"><option value="개">개</option><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="팩">팩</option><option value="봉">봉</option></select></div>
      <div class="col-2"><label class="form-label">중량</label><input type="number" id="fWeight" class="form-control form-control-sm" value="0"></div>
      <div class="col-2"><label class="form-label">단위</label><select id="fWeightUnit" class="form-select form-select-sm"><option>g</option><option>kg</option></select></div>
    </div>
    <hr class="my-2">
    <div class="row mb-2">
      <div class="col-4"><label class="form-label text-success">네이버</label><input type="number" id="fNaverPrice" class="form-control form-control-sm" value="0"></div>
      <div class="col-4"><label class="form-label text-danger">쿠팡</label><input type="number" id="fCoupangPrice" class="form-control form-control-sm" value="0"></div>
      <div class="col-4"><label class="form-label text-primary">로켓</label><input type="number" id="fRocketPrice" class="form-control form-control-sm" value="0"></div>
    </div>
    <div class="row mb-2">
      <div class="col-6"><label class="form-label">바코드</label><input type="text" id="fBarcode" class="form-control form-control-sm" placeholder="바코드 스캔"></div>
      <div class="col-6"><label class="form-label">메모</label><input type="text" id="fMemo" class="form-control form-control-sm"></div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-primary btn-sm" onclick="saveProduct()">저장</button></div>
</div></div></div>

<script>
const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]')?.content || '';
let currentPage = 1;

function loadProducts(page=1) {
  currentPage = page;
  const params = new URLSearchParams({
    page, per_page: 50,
    keyword: document.getElementById('keyword').value,
    material_type: document.getElementById('materialType').value,
    storage_method: document.getElementById('storageMethod').value,
  });
  fetch(`/orders/api/product-manage?${params}`, {headers: {'X-CSRFToken': CSRF_TOKEN}})
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return alert(d.error);
      const body = document.getElementById('productBody');
      body.innerHTML = '';
      window._productData = d.data;
      d.data.forEach((p, idx) => {
        body.innerHTML += `<tr>
          <td><strong>${p.sku||'-'}</strong></td>
          <td>${p.product_name||''}</td>
          <td>${p.cost_type||''}</td>
          <td>${p.material_type||''}</td>
          <td>${p.storage_method||''}</td>
          <td>${p.unit||''}</td>
          <td>${p.weight ? p.weight + (p.weight_unit||'g') : '-'}</td>
          <td class="text-muted small">${p.barcode||''}</td>
          <td class="text-muted small">${p.memo||''}</td>
          <td><button class="btn btn-outline-primary btn-sm py-0" onclick="editProduct(window._productData[${idx}])">수정</button></td>
        </tr>`;
      });
      // 간단 페이지네이션
      const pg = document.getElementById('pagination');
      pg.innerHTML = '';
      if (page > 1) pg.innerHTML += `<button class="btn btn-sm btn-outline-secondary me-1" onclick="loadProducts(${page-1})">◀ 이전</button>`;
      pg.innerHTML += `<span class="mx-2">페이지 ${page}</span>`;
      if (d.data.length >= 50) pg.innerHTML += `<button class="btn btn-sm btn-outline-secondary ms-1" onclick="loadProducts(${page+1})">다음 ▶</button>`;
    });
}

function showAddModal() {
  document.getElementById('editMode').value = 'add';
  document.getElementById('modalTitle').textContent = '신규 상품 추가';
  document.getElementById('fProductName').value = '';
  document.getElementById('fProductName').disabled = false;
  document.getElementById('fSku').value = '';
  document.getElementById('fCostType').value = '매입';
  document.getElementById('fMaterialType').value = '완제품';
  document.getElementById('fStorage').value = '';
  document.getElementById('fCostPrice').value = 0;
  document.getElementById('fUnit').value = '개';
  document.getElementById('fWeight').value = 0;
  document.getElementById('fWeightUnit').value = 'g';
  document.getElementById('fNaverPrice').value = 0;
  document.getElementById('fCoupangPrice').value = 0;
  document.getElementById('fRocketPrice').value = 0;
  document.getElementById('fBarcode').value = '';
  document.getElementById('fMemo').value = '';
  new bootstrap.Modal(document.getElementById('productModal')).show();
}

function editProduct(p) {
  document.getElementById('editMode').value = 'edit';
  document.getElementById('editName').value = p.product_name;
  document.getElementById('modalTitle').textContent = `수정: ${p.product_name}`;
  document.getElementById('fProductName').value = p.product_name;
  document.getElementById('fProductName').disabled = false;  // rename 허용
  document.getElementById('fSku').value = p.sku || '';
  document.getElementById('fCostType').value = p.cost_type || '매입';
  document.getElementById('fMaterialType').value = p.material_type || '완제품';
  document.getElementById('fStorage').value = p.storage_method || '';
  document.getElementById('fCostPrice').value = p.cost_price || 0;
  document.getElementById('fUnit').value = p.unit || '개';
  document.getElementById('fWeight').value = p.weight || 0;
  document.getElementById('fWeightUnit').value = p.weight_unit || 'g';
  document.getElementById('fNaverPrice').value = p.naver_price || 0;
  document.getElementById('fCoupangPrice').value = p.coupang_price || 0;
  document.getElementById('fRocketPrice').value = p.rocket_price || 0;
  document.getElementById('fBarcode').value = p.barcode || '';
  document.getElementById('fMemo').value = p.memo || '';
  new bootstrap.Modal(document.getElementById('productModal')).show();
}

async function saveProduct() {
  const mode = document.getElementById('editMode').value;
  const origName = document.getElementById('editName').value;
  const newName = document.getElementById('fProductName').value.trim();
  const body = {
    product_name: newName,
    sku: document.getElementById('fSku').value.trim(),
    cost_type: document.getElementById('fCostType').value,
    material_type: document.getElementById('fMaterialType').value,
    storage_method: document.getElementById('fStorage').value,
    cost_price: parseFloat(document.getElementById('fCostPrice').value) || 0,
    unit: document.getElementById('fUnit').value,
    weight: parseFloat(document.getElementById('fWeight').value) || 0,
    weight_unit: document.getElementById('fWeightUnit').value,
    naver_price: parseFloat(document.getElementById('fNaverPrice').value) || 0,
    coupang_price: parseFloat(document.getElementById('fCoupangPrice').value) || 0,
    rocket_price: parseFloat(document.getElementById('fRocketPrice').value) || 0,
    barcode: document.getElementById('fBarcode').value.trim(),
    memo: document.getElementById('fMemo').value,
  };
  if (!body.product_name) return alert('상품명을 입력하세요.');

  // 수정 모드에서 이름이 변경됐으면 rename API 먼저 호출 (이력까지 일괄 반영)
  let targetName = origName;
  if (mode === 'edit' && newName && newName !== origName) {
    // 영향도 미리보기
    let preview = null;
    try {
      const pr = await fetch('/master/api/product/rename/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN},
        body: JSON.stringify({old_name: origName, new_name: newName}),
      });
      preview = await pr.json();
    } catch (e) {}

    let msg = `상품명: "${origName}" → "${newName}"\n\n`;
    if (preview && preview.before) {
      msg += '— 반영될 건수 —\n';
      let any = false;
      for (const [t, c] of Object.entries(preview.before)) {
        if (c && c > 0) { msg += `  ${t}: ${c}건\n`; any = true; }
      }
      if (!any) msg += '  (product_costs/products 만 해당)\n';
      const conf = preview.conflict_with_new || {};
      const confList = Object.entries(conf).filter(([_, v]) => v && v > 0);
      if (confList.length) {
        msg += '\n⚠️ 신규 이름 중복 감지:\n';
        for (const [t, c] of confList) msg += `  ${t}: ${c}건 (병합됨)\n`;
      }
    }
    msg += '\n※ 문제 시 감사로그에서 되돌리기 가능. 진행?';

    if (!confirm(msg)) return;

    try {
      const r = await fetch('/master/api/product/rename', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN},
        body: JSON.stringify({old_name: origName, new_name: newName}),
      });
      const data = await r.json();
      if (!data.success) {
        alert('이름 변경 실패: ' + (data.error || ''));
        return;
      }
      const ch = data.changed || {};
      const summary = Object.entries(ch).filter(([_, v]) => v > 0)
        .map(([k, v]) => `${k}:${v}`).join(' ');
      // 성공 시 말없이 진행 (결과는 아래 save alert에 합침)
      targetName = newName;
    } catch (e) {
      alert('이름 변경 중 오류: ' + e.message);
      return;
    }
  }

  const url = mode === 'add' ? '/orders/api/product-manage' : `/orders/api/product-manage/${encodeURIComponent(targetName)}`;
  const method = mode === 'add' ? 'POST' : 'PUT';

  fetch(url, {method, headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN}, body: JSON.stringify(body)})
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return alert(d.error);
      alert(d.message);
      bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
      loadProducts(currentPage);
    });
}

// ═══════ 로켓상품관리 ═══════
let _rocketLoaded = false;

function loadRocketProducts() {
  fetch('/orders/api/rocket-products', {headers: {'X-CSRFToken': CSRF_TOKEN}})
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return alert(d.error);
      _rocketLoaded = true;
      const body = document.getElementById('rocketBody');
      body.innerHTML = '';
      if (!d.data.length) {
        body.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">등록된 로켓상품이 없습니다.</td></tr>';
        return;
      }
      d.data.forEach((it, idx) => {
        window._rocketData = d.data;
        const nm = (it.product_name || '').replace(/"/g, '&quot;');
        const dbBadge = it.in_products
          ? '<span class="badge bg-success">정상</span>'
          : '<span class="badge bg-danger">유령</span>';
        body.innerHTML += `<tr class="${it.in_products ? '' : 'table-warning'}">
          <td><strong>${nm}</strong></td>
          <td class="text-end">${(it.rocket_price||0).toLocaleString()}원</td>
          <td class="text-center">${dbBadge}</td>
          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm py-0" onclick="editRocket(window._rocketData[${idx}])">수정</button>
            <button class="btn btn-outline-danger btn-sm py-0" onclick="removeRocket('${nm}')">제외</button>
          </td>
        </tr>`;
      });
    });
}

function _fillRocketDatalist() {
  fetch('/orders/api/product-manage?per_page=1000', {headers: {'X-CSRFToken': CSRF_TOKEN}})
    .then(r => r.json())
    .then(d => {
      const dl = document.getElementById('rkProductList');
      dl.innerHTML = '';
      (d.data || []).forEach(p => {
        const o = document.createElement('option');
        o.value = p.product_name;
        dl.appendChild(o);
      });
    });
}

function showRocketModal() {
  document.getElementById('rocketModalTitle').textContent = '로켓상품 추가';
  document.getElementById('rkOrigName').value = '';
  document.getElementById('rkProductName').value = '';
  document.getElementById('rkProductName').disabled = false;
  document.getElementById('rkPrice').value = '';
  _fillRocketDatalist();
  new bootstrap.Modal(document.getElementById('rocketModal')).show();
}

function editRocket(it) {
  document.getElementById('rocketModalTitle').textContent = '로켓상품 수정';
  document.getElementById('rkOrigName').value = it.product_name;
  document.getElementById('rkProductName').value = it.product_name;
  document.getElementById('rkProductName').disabled = false;  // 유령이름 정정 허용
  document.getElementById('rkPrice').value = it.rocket_price || 0;
  _fillRocketDatalist();
  new bootstrap.Modal(document.getElementById('rocketModal')).show();
}

function saveRocketProduct() {
  const orig = document.getElementById('rkOrigName').value;
  const name = document.getElementById('rkProductName').value.trim();
  const price = parseFloat(document.getElementById('rkPrice').value) || 0;
  if (!name) return alert('상품명을 입력하세요.');
  if (price <= 0) return alert('로켓판매가를 입력하세요.');

  // 추가는 기존 add-product API, 수정은 update API
  const isEdit = !!orig;
  const url = isEdit ? '/orders/api/rocket-products/update' : '/orders/api/rocket-manual/add-product';
  const body = isEdit
    ? {orig_name: orig, product_name: name, rocket_price: price}
    : {product_name: name, rocket_price: price};

  fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN}, body: JSON.stringify(body)})
    .then(r => r.json())
    .then(d => {
      if (!(d.ok || d.success)) return alert('실패: ' + (d.error || ''));
      alert(d.message || '저장 완료');
      bootstrap.Modal.getInstance(document.getElementById('rocketModal')).hide();
      loadRocketProducts();
    })
    .catch(e => alert('오류: ' + e.message));
}

function removeRocket(name) {
  if (!confirm(`"${name}" 을(를) 로켓상품에서 제외할까요?\n(로켓매출 드롭다운에서 사라집니다)`)) return;
  fetch('/orders/api/rocket-products/remove', {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN},
    body: JSON.stringify({product_name: name}),
  })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return alert('실패: ' + (d.error || ''));
      loadRocketProducts();
    });
}

document.addEventListener('DOMContentLoaded', () => loadProducts());
</script>
{% endblock %}
