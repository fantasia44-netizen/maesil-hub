{% extends "base.html" %}
{% block title %}비밀번호 변경 — 매실 허브{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-4">
    <div class="card">
      <div class="card-header fw-semibold"><i class="bi bi-key me-2"></i>비밀번호 변경</div>
      <div class="card-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
          <div class="alert alert-{{ 'danger' if cat == 'danger' else 'success' }} py-2">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">현재 비밀번호</label>
            <input type="password" name="current_password" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">새 비밀번호 (최소 10자)</label>
            <input type="password" name="new_password" class="form-control" minlength="10" required>
          </div>
          <div class="mb-3">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" name="confirm_password" class="form-control" minlength="10" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">변경</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
